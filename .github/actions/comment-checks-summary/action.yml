name: Comment checks summary on a pull request
description: Posts a summary file as a pull request comment, updating the comment carrying the same marker if one is already there.

inputs:
  marker:
    description: HTML comment identifying this job's comment, so a job updates its own and never another job's.
    required: true
  summary-file:
    description: Path to the markdown file to post.
    required: true
  label:
    description: How this set of checks is named in the warnings, such as Lua or frontend.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        COMMENT_MARKER: ${{ inputs.marker }}
        SUMMARY_FILE: ${{ inputs.summary-file }}
        CHECKS_LABEL: ${{ inputs.label }}
      with:
        script: |
          const fs = require("fs");
          const marker = process.env.COMMENT_MARKER;
          const label = process.env.CHECKS_LABEL;

          let body;
          try {
            body = fs.readFileSync(process.env.SUMMARY_FILE, "utf8");
          } catch (error) {
            core.warning(`Could not read ${label} checks summary file: ${error.message}`);
            return;
          }
          if (!body.includes(marker)) {
            body = `${marker}\n${body}`;
          }

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          let existingCommentId = null;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              existingCommentId = existing.id;
            }
          } catch (error) {
            core.warning(`Could not list existing pull request comments: ${error.message}`);
          }

          if (existingCommentId !== null) {
            try {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingCommentId,
                body,
              });
              return;
            } catch (error) {
              core.warning(
                `Could not update existing ${label} checks comment: ${error.message}. Falling back to creating a new comment.`
              );
            }
          }

          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body,
          });
