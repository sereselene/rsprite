name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - release/**
  push:
    branches:
      - main
      - release/**

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LUACHECK_VERSION: "1.2.0"

jobs:
  lua:
    name: Lua formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore the cached Luacheck install
        id: luacheck-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.luarocks
          key: ${{ runner.os }}-${{ runner.arch }}-luarocks-luacheck-${{ env.LUACHECK_VERSION }}

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Install Luacheck
        if: steps.luacheck-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --yes luarocks liblua5.1-0-dev
          luarocks install --local luacheck "$LUACHECK_VERSION"

      - name: Put Luacheck on the path
        run: echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

      - name: Check Lua formatting (StyLua)
        id: stylua-check
        continue-on-error: true
        run: npx stylua --config-path stylua.toml --check . 2>&1 | tee /tmp/stylua-output.txt

      - name: Run Luacheck
        id: luacheck-check
        continue-on-error: true
        run: luacheck --no-color --config .luacheckrc plugins examples tests 2>&1 | tee /tmp/luacheck-output.txt

      - name: Write Lua checks summary
        if: always()
        shell: bash
        run: |
          {
            echo "<!-- lua-checks-summary -->"
            echo "### Lua formatting and lint"
            echo ""
            if [ "${{ steps.stylua-check.outcome }}" = "success" ]; then
              echo "StyLua: passed"
            else
              echo "StyLua: failed. Run \`npm run format\` locally to fix it."
              echo ""
              echo '```diff'
              head -n 200 /tmp/stylua-output.txt
              echo '```'
            fi
            echo ""
            if [ "${{ steps.luacheck-check.outcome }}" = "success" ]; then
              echo "Luacheck: passed"
            else
              echo "Luacheck: failed"
              echo ""
              echo '```'
              grep -E '^[[:space:]]+[^[:space:]]+:[0-9]+:[0-9]+: |^Total: ' /tmp/luacheck-output.txt | head -n 40
              echo '```'
            fi
          } > /tmp/lua-summary.md
          cat /tmp/lua-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the Lua checks summary for the comment job
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lua-checks-summary
          path: /tmp/lua-summary.md
          retention-days: 1
          if-no-files-found: warn

      - name: Fail if Lua checks failed
        run: |
          if [ "${{ steps.stylua-check.outcome }}" = "failure" ] || [ "${{ steps.luacheck-check.outcome }}" = "failure" ]; then
            exit 1
          fi

  lua-summary-comment:
    name: Comment the Lua checks summary
    needs: lua
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out the comment action from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download the Lua checks summary
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lua-checks-summary
          path: ${{ runner.temp }}/lua-checks-summary

      - name: Comment the Lua checks summary on the pull request
        uses: ./.github/actions/comment-checks-summary
        with:
          marker: "<!-- lua-checks-summary -->"
          summary-file: ${{ runner.temp }}/lua-checks-summary/lua-summary.md
          label: Lua

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the tests
        run: npm test

  catalogue:
    name: Catalogue is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check the generated catalogue files
        run: npm run catalogue -- --check
