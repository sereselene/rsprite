name: Pull request checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - release/**

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLINT_VERSION: "0.19.1"

jobs:
  validate:
    name: Validate PR title format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      type: ${{ steps.parse-type.outputs.type }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitlint
        run: pip install "gitlint==${GITLINT_VERSION}"

      - name: Write PR title to a synthetic commit message file
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt

      - name: Run gitlint against the PR title
        id: gitlint
        run: |
          if gitlint --msg-filename /tmp/pr-title.txt > /tmp/gitlint-output.txt 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a clear failure message
        if: steps.gitlint.outputs.passed == 'false'
        run: |
          {
            echo "### PR title check failed"
            echo ""
            echo "The PR title does not match the required format."
            echo ""
            echo "Expected: \`type(scope): emoji description\`, optionally ending with \`#issue\`"
            printf 'Example: \x60feat(core): \u2728 add a tag filter to Find\x60\n'
            echo ""
            echo "Allowed types, scopes, and emoji are defined in \`.gitlint-rules/type_scope_format.py\`."
            echo ""
            echo "Full gitlint output:"
            echo ""
            echo '```'
            cat /tmp/gitlint-output.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Parse the commit type from the title
        id: parse-type
        if: steps.gitlint.outputs.passed == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          type=$(printf '%s\n' "$PR_TITLE" | sed -E 's/^([a-z]+)\(.*/\1/')
          echo "type=$type" >> "$GITHUB_OUTPUT"

  label:
    name: Apply a type label
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Apply the matching type label to the pull request
        uses: actions/github-script@v7
        env:
          COMMIT_TYPE: ${{ needs.validate.outputs.type }}
        with:
          script: |
            const type = process.env.COMMIT_TYPE;
            const label = `type: ${type}`;

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [label],
              });
            } catch (error) {
              core.warning(
                `Could not apply label "${label}": ${error.message}. ` +
                "Create this label in the repository first if it does not exist yet."
              );
            }

  pull-request-details:
    name: Pull request details
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check the description against the template
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "").replace(/\r\n/g, "\n");
            const sectionNames = ["What this changes", "Why", "How it was tested", "Checklist"];
            const writtenSections = ["What this changes", "Why", "How it was tested"];
            const checklistItems = [
              { key: "npm test", label: "npm test passes" },
              { key: "npm run catalogue", label: "npm run catalogue was run if the catalogue changed" },
              { key: "generated file", label: "no generated file was edited by hand" },
              { key: "CHANGELOG.md", label: "README and CHANGELOG are updated if behaviour changed" },
              { key: "type(scope)", label: "the title follows the required format" },
            ];
            const templatePath = ".github/pull_request_template.md";

            const linesBySection = new Map();
            let currentSection = null;
            for (const line of body.split("\n")) {
              const heading = /^##\s+(.+?)\s*$/.exec(line);
              if (heading !== null) {
                currentSection = heading[1];
                linesBySection.set(currentSection, []);
              } else if (currentSection !== null) {
                linesBySection.get(currentSection).push(line);
              }
            }

            if (!sectionNames.some((name) => linesBySection.has(name))) {
              core.setFailed(`The description is missing the pull request template. Copy it from ${templatePath} and fill it in.`);
              return;
            }

            const withoutHints = (lines) => lines.join("\n").replace(/<!--[\s\S]*?-->/g, "").trim();
            const problems = [];

            const missingSections = sectionNames.filter((name) => !linesBySection.has(name));
            if (missingSections.length > 0) {
              problems.push(`Add these sections back from ${templatePath}: ${missingSections.join(", ")}.`);
            }

            const emptySections = writtenSections.filter((name) => linesBySection.has(name) && withoutHints(linesBySection.get(name)) === "");
            if (emptySections.length > 0) {
              problems.push(`Fill in these sections: ${emptySections.join(", ")}.`);
            }

            if (linesBySection.has("Checklist")) {
              const checklistLines = linesBySection.get("Checklist");
              const untickedItems = [];
              const missingItems = [];
              for (const item of checklistItems) {
                const line = checklistLines.find((candidate) => /^\s*[-*]\s+\[[ xX]\]/.test(candidate) && candidate.includes(item.key));
                if (line === undefined) {
                  missingItems.push(item.label);
                } else if (!/^\s*[-*]\s+\[[xX]\]/.test(line)) {
                  untickedItems.push(item.label);
                }
              }
              if (untickedItems.length > 0) {
                problems.push(`Tick these checklist items: ${untickedItems.join("; ")}.`);
              }
              if (missingItems.length > 0) {
                problems.push(`Put these checklist items back from ${templatePath}: ${missingItems.join("; ")}.`);
              }
            }

            if (problems.length > 0) {
              core.setFailed(problems.join("\n"));
              return;
            }
            core.info("Every section is filled in and every checklist item is ticked.");
