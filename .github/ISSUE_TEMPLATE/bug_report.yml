name: Bug report
description: Something in rsprite or the finder doesn't work as it should.
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any rsprite warnings or errors from the console.
    validations:
      required: true
  - type: textarea
    id: what-you-expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: client-build
    attributes:
      label: Game client build
      placeholder: "950-1"
    validations:
      required: true
  - type: input
    id: rsprite-version
    attributes:
      label: rsprite version
      description: The value of `rsprite.version`.
      placeholder: "X.Y.Z"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The calls or clicks that lead to the problem.
    validations:
      required: true
