lefthook: node node_modules/lefthook/bin/index.js

source_dir: scripts/hooks/

commit-msg:
  commands:
    gitlint:
      run: gitlint --msg-filename {1}

pre-commit:
  commands:
    stylua:
      glob: "*.lua"
      run: npx stylua --config-path stylua.toml --check {staged_files}
    luacheck:
      glob: "*.lua"
      run: luacheck --config .luacheckrc {staged_files}

pre-push:
  scripts:
    "release-tag.mjs":
      runner: node
      use_stdin: true
